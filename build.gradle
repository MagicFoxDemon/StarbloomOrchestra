plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
}

group = 'dev.starbloom.orchestra'
version = mod_version
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// 车万女仆是可选的（女仆坐上琴凳、乐器工位时的演奏姿势，docs/ORCHESTRA.md 第 16 节）。要 1.20.1 Forge 版的 jar，
// 编译时用本地的 jar：-Ptlm_jar=<路径> 或 libs/touhoulittlemaid-1.20.1.jar；没有 jar 时兼容的代码不参与编译，游戏照常。
// 发布用的 jar 一定要带着女仆的 jar 编译，否则女仆坐上琴凳不会摆演奏姿势。
def tlmJar = file(project.findProperty('tlm_jar') ?: 'libs/touhoulittlemaid-1.20.1.jar')
def tlmCoord = null
if (tlmJar.exists()) {
    // ModDevGradle 2.0.148 的 LegacyForge 对 files(...) 会触发 Gradle DependencyConstraint 报错；
    // 放进 .gradle/tlm-repo（被 .gitignore 忽略且不受 clean 清理影响）让 modCompileOnly/modRuntimeOnly 按模块坐标做 SRG→Mojmap 反混淆
    def tlmVer = "1.20.1-${tlmJar.length()}"
    tlmCoord = "local.tlm:touhoulittlemaid:${tlmVer}"
    def tlmRepo = file('.gradle/tlm-repo')
    def staged = new File(tlmRepo, "local/tlm/touhoulittlemaid/${tlmVer}/touhoulittlemaid-${tlmVer}.jar")
    if (!staged.exists() || staged.lastModified() < tlmJar.lastModified()) {
        staged.parentFile.mkdirs()
        java.nio.file.Files.copy(tlmJar.toPath(), staged.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
    repositories {
        exclusiveContent {
            forRepository {
                maven {
                    url = tlmRepo.toURI()
                    metadataSources { artifact() }
                }
            }
            filter { includeGroup 'local.tlm' }
        }
    }
} else {
    logger.lifecycle("Touhou Little Maid compat left out: no jar at ${tlmJar} (pass -Ptlm_jar=<path>)")
    sourceSets.main.java {
        exclude 'dev/starbloom/orchestra/client/music/MaidMusicians.java'
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    // Ponder（按住 W 思索的图文讲解，机械动力的作者拆出来的库）；1.20.1 用官方发布的版本
    exclusiveContent {
        forRepository { maven { name = 'createmod'; url = 'https://maven.createmod.net' } }
        filter { includeGroup 'net.createmod.ponder'; includeGroup 'net.createmod.catnip'; includeGroup 'dev.engine-room.flywheel' }
    }
}

legacyForge {
    version = forge_version
    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }
    runs {
        client {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            // 世界测试用自己的世界 run/gametestserver/gametestworld（每次 Gradle 启动前清空，见下面的 tasks.configureEach），
            // 不碰 runServer 的 run/world
            programArguments.addAll '--universe', 'gametestserver', '--world', 'gametestworld'
            // 1.20.1 的 GameTestServer 不认 --tests、--report、--repeatCount：选测试、复制、写 JUnit 报告由本模组读这几个系统属性做
            //（gametest/GameTestFunctions）。-PorchestraTests 照旧是 starbloom_orchestra:instrument_* 这样的通配，逗号分开可以写几个
            systemProperty 'starbloom_orchestra.tests', providers.gradleProperty('orchestraTests').getOrElse("${mod_id}:*")
            systemProperty 'starbloom_orchestra.test_report', file('build/gametest-results.xml').absolutePath
            // 查偶发失败用：-PorchestraTestRepeat=50 把选中的每个测试复制 50 份放进同一批
            if (project.hasProperty('orchestraTestRepeat')) systemProperty 'starbloom_orchestra.test_repeat', project.property('orchestraTestRepeat').toString()
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods { starbloom_orchestra { sourceSet sourceSets.main } }
}
legacyForge.addModdingDependenciesTo(sourceSets.test)

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // Ponder 和 Flywheel（都是 MIT）打包进本模组的 jar（jar-in-jar，同机械动力的做法）：
    // 玩家不用另装；别的模组也带着时，Forge 只加载版本最高的那一份。1.20.1 的 Ponder 在 mods.toml 里要求 Flywheel，
    // 本模组的代码不用 Flywheel，所以只在运行时带上。开发期通过 modImplementation/modRuntimeOnly 反混淆，发布 jar 通过 jarJar 打包 SRG 原始 jar。
    modImplementation("net.createmod.ponder:Ponder-Forge-1.20.1:${ponder_version}") { transitive = false }
    modRuntimeOnly("dev.engine-room.flywheel:flywheel-forge-1.20.1:${flywheel_version}") { transitive = false }
    jarJar("net.createmod.ponder:Ponder-Forge-1.20.1:${ponder_version}") { transitive = false }
    jarJar("dev.engine-room.flywheel:flywheel-forge-1.20.1:${flywheel_version}") { transitive = false }
    // 车万女仆只在编译时用；-Ptlm 把它加进开发环境的运行
    if (tlmCoord != null) {
        modCompileOnly(tlmCoord) { transitive = false }
        if (project.hasProperty('tlm')) modRuntimeOnly(tlmCoord) { transitive = false }
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('jar', Jar).configure {
    manifest.attributes([
        'MixinConfigs': "${mod_id}.mixins.json"
    ])
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging { events 'passed', 'failed' }
    // SampleMapTest 核对「音乐厅音源」资源包；测试 JVM 的工作目录不是项目根目录，路径从这里传
    systemProperty 'starbloom_orchestra.concert_hall_pack', file('resourcepacks/concert_hall').absolutePath
    // 管风琴新旧合成的试听：-PorganDemo=<输出目录> 时 OrganDemoTest 渲染 wav，否则跳过
    systemProperty 'starbloom_orchestra.organ_demo', providers.gradleProperty('organDemo').getOrElse('')
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '5000']
}

// 思索场景（docs/PONDER.md）：-PponderExport 时世界测试 ponder_layouts 把每份布置存成蓝图。
// 加在任务上、不加在 runs 里：runs 的参数会写进 build/moddev，以后从 IDE 启动也一直带着。
tasks.configureEach { task ->
    if (task.name == 'runGameTestServer') {
        def testUniverse = file('run/gametestserver')
        task.doFirst { project.delete(testUniverse) }
    }
    if (task.name == 'runGameTestServer' && project.hasProperty('ponderExport')) {
        task.jvmArgs "-Dstarbloom_orchestra.ponder_export=${file('src/main/resources/assets/starbloom_orchestra/ponder').absolutePath}"
    }
}

// 「音乐厅音源」资源包：乐器的录音采样不进模组的 jar（本体只带合成音源），单独打成 zip 发布，装上即换成录音。
// 见 docs/INSTRUMENT_SAMPLES.md。./gradlew concertHallPack → build/libs/<mod_id>-concert_hall-<版本>.zip
tasks.register('concertHallPack', Zip) {
    group = 'build'
    description = 'Zips resourcepacks/concert_hall, the recorded instrument samples, as a separate resource pack.'
    from 'resourcepacks/concert_hall'
    archiveFileName = "${mod_id}-concert_hall-${version}.zip"
    destinationDirectory = layout.buildDirectory.dir('libs')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
