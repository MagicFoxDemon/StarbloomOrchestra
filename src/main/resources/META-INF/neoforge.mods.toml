[[mods]]
modId="starbloom_orchestra"
version="0.1.0"
displayName="Starbloom Orchestra"
authors="Kitsune Sakura"
description='''
Playable instruments for Minecraft: grand piano, harp, pipe organ, strings, winds, mallets and orchestral percussion, played by keyboard, MIDI keyboard, punched music rolls or imported MIDI files. Seat players, mobs and Touhou Little Maid maids at benches and posts, and conduct the whole orchestra with a baton.
星辰花乐团：可以演奏的乐器（三角钢琴、竖琴、管风琴、弦乐、木管铜管、键盘打击乐、管弦乐打击乐），用键盘、MIDI 键盘、打孔纸带或导入的 MIDI 演奏；让玩家、生物和车万女仆坐上琴凳、站上工位，拿指挥棒指挥整个乐团。
'''
enumExtensions="META-INF/enumextensions.json"

[[dependencies.starbloom_orchestra]]
modId="neoforge"
type="required"
versionRange="[21.1.267,)"
ordering="NONE"
side="BOTH"

[[dependencies.starbloom_orchestra]]
modId="minecraft"
type="required"
versionRange="[1.21.1]"
ordering="NONE"
side="BOTH"

